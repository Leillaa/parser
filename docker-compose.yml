services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinomax}
      POSTGRES_USER: ${POSTGRES_USER:-kinomax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinomax}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5433}:5432"          # подключение из DBeaver/DataGrip: localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  parser:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinomax}:${POSTGRES_PASSWORD:-kinomax}@db:5432/${POSTGRES_DB:-kinomax}
      DAILY_AT: ${DAILY_AT:-03:00}               # ежедневный запуск, время московское
      LEAD_MINUTES: ${LEAD_MINUTES:-5}           # за сколько минут до начала снимать зал
      REFRESH_MINUTES: ${REFRESH_MINUTES:-60}    # как часто искать новые сеансы в течение дня
      CITY: ${CITY:-}                            # пусто = все города
      TZ: Europe/Moscow
    command: ["python", "kinomax_parser.py", "--daemon", "--quiet"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Тесты: docker compose --profile test run --rm --build tests
  # Работают с отдельной БД kinomax_test, рабочую БД не трогают.
  tests:
    build: .
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-kinomax}:${POSTGRES_PASSWORD:-kinomax}@db:5432/kinomax_test
    volumes:
      - ./tests:/app/tests:ro
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]

volumes:
  pgdata:
